name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up MinGW
        uses: egor-tensin/setup-mingw@v2
        with:
          platform: x64

      - name: Test
        run: go test ./...

      - name: Build Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -trimpath -ldflags "-H=windowsgui -s -w" -o dist/g2-password-tools-windows-amd64.exe .

      - name: Generate checksum
        shell: pwsh
        run: |
          $artifact = "dist/g2-password-tools-windows-amd64.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $artifact).Hash.ToLowerInvariant()
          "$hash  g2-password-tools-windows-amd64.exe" | Out-File -Encoding ascii "dist/g2-password-tools-windows-amd64.exe.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/g2-password-tools-windows-amd64.exe
            dist/g2-password-tools-windows-amd64.exe.sha256
