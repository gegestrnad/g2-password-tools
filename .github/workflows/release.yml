name: Build Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag/version (e.g., v1.0.0)'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24.1'

      - name: Install dependencies
        run: |
          go mod download
          go mod verify

      - name: Build executable
        run: |
          $env:CGO_ENABLED = "1"
          go build -o g2-password-tools.exe -ldflags="-H windowsgui" .
        shell: pwsh

      - name: Create release
        if: github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v1
        with:
          files: g2-password-tools.exe
          tag_name: ${{ github.event.inputs.release_tag }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        if: github.event.inputs.release_tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: g2-password-tools-exe
          path: g2-password-tools.exe
          retention-days: 30
